apiVersion: v1
kind: ServiceAccount
metadata:
  name: rsocket-simulation-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rsocket-simulation-pipeline
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rsocket-simulation-pipeline
subjects:
  - kind: ServiceAccount
    name: rsocket-simulation-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rsocket-simulation-pipeline
