name: Run Simulation on Oracle OKE

on:
  workflow_dispatch:
    inputs:
      serverUri:
        description: 'RSocket Target Server URI'
        required: true
        default: 'ws://rsocket-server.default.svc.cluster.local:7000'
        type: string
      route:
        description: 'RSocket routing frame endpoint'
        required: true
        default: 'simulation.stream'
        type: string
      shards:
        description: 'Number of simulation shards (Pods)'
        required: true
        default: '4'
        type: string
      parallelism:
        description: 'Parallel client execution threads per shard'
        required: true
        default: '4'
        type: string
      connectionsPerShard:
        description: 'RSocket connections established per shard'
        required: true
        default: '500'
        type: string
      duration:
        description: 'Simulation run time (ISO-8601 duration string)'
        required: true
        default: 'PT10M'
        type: string

env:
  IMAGE: ghcr.io/stanimirivanov/rsocket-simulation:2.0.0
  # OCI Environment variables used by oracle-actions
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}

jobs:
  execute-simulation:
    name: Run simulation
    runs-on: ubuntu-latest
    environment: oci-oke-staging

    # Strictly allow ONLY the repository owner
    if: github.actor == github.repository_owner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Kubectl for OKE
        uses: oracle-actions/configure-kubectl-oke@v1.5.0
        with:
          cluster: ${{ secrets.OKE_CLUSTER_OCID }}

      - name: Install Tekton CLI
        run: |
          curl -LO https://github.com/tektoncd/cli/releases/download/v0.38.0/tkn_0.38.0_Linux_x86_64.tar.gz
          sudo tar xvzf tkn_0.38.0_Linux_x86_64.tar.gz -C /usr/local/bin tkn

      - name: Ensure Tekton Pipelines Engine is Installed
        run: |
          if ! kubectl get namespace tekton-pipelines >/dev/null 2>&1; then
            echo "Tekton Engine not found. Installing..."
            kubectl apply -f https://storage.googleapis.com/tekton-releases/pipeline/v0.68.0/release.yaml
            kubectl rollout status deployment/tekton-pipelines-controller -n tekton-pipelines --timeout=120s
            kubectl rollout status deployment/tekton-pipelines-webhook -n tekton-pipelines --timeout=120s
          else
            echo "Tekton Engine is already installed. Skipping installation."
          fi

      - name: Apply Tekton Manifests
        run: |
          kubectl apply -f tekton/rbac.yaml
          kubectl apply -f tekton/tasks.yaml
          kubectl apply -f tekton/pipeline.yaml

      - name: Execute Tekton PipelineRun
        run: |
          RUN_NAME="rsocket-run-${{ github.run_id }}-${{ github.run_attempt }}"
      
          cat <<EOF | kubectl apply -f -
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            name: ${RUN_NAME}
            namespace: default
          spec:
            pipelineRef:
              name: rsocket-simulation
            taskRunTemplate:
              serviceAccountName: rsocket-simulation-pipeline
            workspaces:
              - name: shared
                emptyDir: {}
            params:
              - name: repositoryUrl
                value: "${{ github.server_url }}/${{ github.repository }}.git"
              - name: revision
                value: "${{ github.ref_name }}"
              - name: releaseName
                value: "rsocket-sim"
              - name: image
                value: "${{ env.IMAGE }}"
              - name: serverUri
                value: "${{ inputs.serverUri }}"
              - name: route
                value: "${{ inputs.route }}"
              - name: shards
                value: "${{ inputs.shards }}"
              - name: parallelism
                value: "${{ inputs.parallelism }}"
              - name: connectionsPerShard
                value: "${{ inputs.connectionsPerShard }}"
              - name: duration
                value: "${{ inputs.duration }}"
          EOF
      
          echo "RUN_NAME=${RUN_NAME}" >> $GITHUB_ENV

      - name: Stream Tekton Logs
        run: |
          tkn pipelinerun logs -f "${{ env.RUN_NAME }}" -n default